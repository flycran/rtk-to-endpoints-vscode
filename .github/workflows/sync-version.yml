name: Sync Version

on:
  repository_dispatch:
    types: [ update-rtk-to-endpoints ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          npm version $VERSION --no-git-tag-version --allow-same-version
          npm install rtk-to-endpoints@$VERSION

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: sync version from rtk-to-endpoints"
          body: "Automated sync of version ${{ github.event.client_payload.version }} from
            rtk-to-endpoints"
          branch: "sync-version-${{ github.event.client_payload.version }}"
          delete-branch: true
          auto-merge: true
