name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run compile

      - name: Sync version from rtk-to-endpoints
        run: |
          RTK_VERSION=$(node -p "require('./node_modules/rtk-to-endpoints/package.json').version")
          echo "Syncing version to $RTK_VERSION"
          npm version $RTK_VERSION --no-git-tag-version --allow-same-version

      - name: Publish to VS Code Marketplace
        run: npx vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
